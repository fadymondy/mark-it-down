name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: i18n parity check
        run: node scripts/check-i18n.mjs
      - name: Unit tests
        run: npm test
      - name: Coverage report
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage -- --coverage.thresholds.statements=0
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 14
      - name: Compile extension + webview + MCP server
        run: npm run compile
      - name: Compile Electron app
        run: npm run compile:electron
      - name: Build Claude plugin bundle
        run: npm run build:claude-plugin

  web:
    name: Web app (Go API + SPA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: apps/web/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/web/package-lock.json
      - name: Build API
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: SPA install
        run: npm ci
        working-directory: apps/web/web
      - name: SPA typecheck
        run: npx tsc --noEmit
        working-directory: apps/web/web
      - name: SPA build
        run: npx vite build
        working-directory: apps/web/web

  chrome-extension:
    name: Chrome extension (MV3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chrome-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/chrome-extension/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Zip
        run: npm run zip
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: apps/chrome-extension/dist-zip/*.zip
          retention-days: 14

  mobile:
    name: Flutter app (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug

  integration:
    name: VSCode integration tests
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile extension
        run: npm run compile
      - name: Compile integration tests
        run: npm run compile:integration
      - name: Run integration tests under xvfb
        run: xvfb-run -a node out/integration/runTest.js
        env:
          MID_DEV: '0'
