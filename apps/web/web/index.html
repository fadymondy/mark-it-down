<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark It Down — your markdown, everywhere</title>
    <meta name="description" content="A beautiful markdown editor for desktop, VSCode, and Chrome — with a cloud notes warehouse and an MCP connector for AI agents." />
    <link rel="icon" type="image/svg+xml" href="/brand/icon.svg" />
    <!-- No-flash theme: apply the persisted choice (default dark) before first paint -->
    <script>
      (function () {
        try {
          var k = "togo-theme", t = localStorage.getItem(k);
          if (!t) { t = "dark"; localStorage.setItem(k, t); }
          var d = document.documentElement;
          d.setAttribute("data-theme", t);
          d.classList.toggle("dark", t !== "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
