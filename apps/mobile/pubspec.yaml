name: mark_it_down
description: "Mark It Down — beautiful markdown notes with a cloud warehouse. Mobile companion to the desktop, VSCode, Chrome, and web apps."
publish_to: "none"
version: 0.3.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  flutter_markdown_plus: ^1.0.3
  url_launcher: ^6.3.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../build/icons/1024.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
